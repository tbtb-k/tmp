<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ゲーム棚</title>
<meta name="description" content="自作のブラウザゲームをまとめた棚です。タップするとすぐ遊べます。">
<meta property="og:title" content="ゲーム棚">
<meta property="og:description" content="自作のブラウザゲームをまとめた棚です。タップするとすぐ遊べます。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#23254A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%23F4B942'/%3E%3Ccircle cx='21' cy='21' r='6' fill='%231D1A33'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%231D1A33'/%3E%3Ccircle cx='43' cy='43' r='6' fill='%231D1A33'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#23254A;
    --night-2:#2F3262;
    --line:#474A86;
    --paper:#F7F4FF;
    --muted:#B4B6DE;
    --ink:#1D1A33;
    --gold:#F4B942;
    --display:"Dela Gothic One","Hiragino Sans","Hiragino Kaku Gothic StdN","Yu Gothic","Noto Sans CJK JP","Noto Sans JP",sans-serif;
    --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans CJK JP","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    min-height:100vh;
    background:var(--night);
    color:var(--paper);
    font-family:var(--body);
    font-weight:500;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  .top, main{max-width:1120px;margin:0 auto;padding-inline:16px}
  @media (min-width:720px){ .top, main{padding-inline:32px} }

  /* ---------- 見出し ---------- */
  .top{padding-top:clamp(32px,7vw,72px);padding-bottom:8px}
  h1{
    margin:0 0 .3em;
    font-family:var(--display);
    font-weight:900;
    font-synthesis:none;
    font-size:clamp(2.75rem,13vw,5.5rem);
    line-height:1;
    letter-spacing:.02em;
  }
  .lead{margin:0;max-width:42em;color:var(--muted);font-size:clamp(.9rem,2.6vw,1rem)}
  .actions{display:flex;align-items:center;gap:16px;margin-top:22px;flex-wrap:wrap}
  .spin{
    display:inline-flex;align-items:center;gap:.55em;
    padding:.8em 1.25em;
    border:0;border-radius:14px;
    background:var(--gold);color:var(--ink);
    font:800 1rem/1 var(--body);
    box-shadow:0 5px 0 #A9761F;
    cursor:pointer;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .spin:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #A9761F}
  .spin:disabled{opacity:.45;cursor:default}
  .spin:focus-visible{outline:3px solid var(--paper);outline-offset:4px}
  .die{width:1.25em;height:1.25em;flex:none}
  body.is-spinning .die{animation:roll .45s linear infinite}
  @keyframes roll{to{transform:rotate(360deg)}}
  .count{color:var(--muted);font-size:.9rem}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
  .chip{
    padding:.4em 1em;
    border:2px solid var(--line);border-radius:999px;
    background:transparent;color:var(--paper);
    font:800 .875rem/1.2 var(--body);
    cursor:pointer;
  }
  .chip[aria-pressed="true"]{background:var(--paper);border-color:var(--paper);color:var(--ink)}
  .chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  /* ---------- 棚（ゲームの箱） ---------- */
  .shelf{
    list-style:none;margin:0;padding:28px 0 72px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
    gap:26px 14px;
  }
  @media (min-width:720px){
    .shelf{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:36px 26px;padding-top:36px}
  }
  .shelf:empty{display:none}
  body.has-pick .shelf{padding-bottom:200px}

  .box{
    --c:#F4B942;
    --edge:rgba(0,0,0,.38);
    --glyph:rgba(0,0,0,.14);
    display:block;color:inherit;text-decoration:none;outline:none;
    -webkit-tap-highlight-color:transparent;
  }
  @supports (color:color-mix(in srgb, red 50%, blue)){
    .box{
      --edge:color-mix(in srgb, var(--c) 58%, #000);
      --glyph:color-mix(in srgb, var(--c) 80%, #000);
    }
  }
  .lid{
    position:relative;display:block;
    aspect-ratio:1/1;
    border-radius:14px;
    background:var(--c);
    color:var(--ink);
    overflow:hidden;
    container-type:inline-size;
    box-shadow:0 8px 0 var(--edge);
    transition:transform .12s ease, box-shadow .12s ease, filter .15s ease;
  }
  /* 箱のふちの印刷っぽい枠 */
  .lid::after{
    content:"";position:absolute;inset:8px;
    border:2px solid rgba(29,26,51,.13);border-radius:8px;
    pointer-events:none;
  }
  .glyph{
    position:absolute;right:-.06em;bottom:-.2em;
    font-family:var(--display);font-weight:900;font-synthesis:none;
    font-size:7rem;font-size:78cqw;line-height:1;
    color:var(--glyph);
    user-select:none;pointer-events:none;
  }
  .genre{
    position:relative;z-index:1;
    display:inline-block;margin:16px 0 0 16px;
    padding:.15em .6em;border-radius:6px;
    background:var(--ink);color:var(--c);
    font-size:.7rem;font-weight:800;line-height:1.5;
  }
  .name{
    position:relative;z-index:1;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;
    padding:14px 16px 0;
    font-family:var(--display);font-weight:900;font-synthesis:none;
    font-size:1.05rem;font-size:clamp(.95rem,9.5cqw,1.4rem);
    line-height:1.3;
    word-break:auto-phrase;overflow-wrap:anywhere;
  }
  .genre + .name{padding-top:8px}
  .has-art{display:flex;flex-direction:column;align-items:flex-start}
  .has-art::after{display:none}
  .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .has-art .genre{margin:12px 0 0 12px}
  .has-art .name{
    display:block;max-width:calc(100% - 20px);
    margin:10px;padding:.35em .65em;border-radius:8px;
    background:var(--ink);color:var(--paper);
    font-size:.95rem;
  }
  .has-art .genre + .name{margin-top:6px;padding-top:.35em}
  .desc{
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
    margin-top:16px;
    color:var(--muted);font-size:.8125rem;line-height:1.55;
  }

  /* 押したとき・キーボード */
  .box:active .lid{transform:translateY(6px);box-shadow:0 2px 0 var(--edge)}
  .box:focus-visible .lid{outline:3px solid var(--paper);outline-offset:4px}

  /* ルーレット中 */
  .box.is-lit .lid,
  .box.is-picked .lid{
    transform:translateY(-8px);
    box-shadow:0 16px 0 var(--edge);
    outline:4px solid var(--paper);outline-offset:4px;
  }
  body.is-spinning .box:not(.is-lit) .lid,
  body.has-pick .box:not(.is-picked) .lid{filter:brightness(.5) saturate(.6)}

  /* 読み込み中 */
  .skeleton .lid{background:var(--night-2);box-shadow:0 8px 0 #1A1C3A}
  .skeleton .lid::after{display:none}
  .skeleton .bar{display:block;height:.8em;width:70%;margin-top:18px;border-radius:6px;background:var(--night-2)}
  .skeleton{animation:pulse 1.4s ease-in-out infinite alternate}
  @keyframes pulse{to{opacity:.45}}

  /* お知らせ・エラー */
  .state{max-width:36em;padding:36px 0 72px;color:var(--muted)}
  .state.is-note{padding:0 0 8px;font-size:.85rem}
  .state strong{display:block;margin-bottom:.4em;color:var(--paper);font-size:1.15rem}
  .state p{margin:0 0 1.2em}

  /* ルーレットの結果 */
  .result{
    position:fixed;z-index:10;left:50%;
    bottom:max(16px, env(safe-area-inset-bottom));
    width:min(560px, calc(100% - 32px));
    transform:translateX(-50%);
    padding:16px 56px 18px 20px;
    border-radius:18px;
    background:var(--paper);color:var(--ink);
    box-shadow:0 10px 0 rgba(0,0,0,.35);
    animation:rise .3s cubic-bezier(.2,.9,.3,1.25);
  }
  @keyframes rise{from{transform:translate(-50%,28px);opacity:0}}
  .result-label{margin:0;font-size:.8rem;font-weight:800;color:#5B5880}
  .result-title{
    margin:.1em 0 .65em;
    font-family:var(--display);font-weight:900;font-synthesis:none;
    font-size:clamp(1.3rem,5.5vw,1.75rem);line-height:1.25;
    word-break:auto-phrase;overflow-wrap:anywhere;
  }
  .result-actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn-go, .btn-again{
    display:inline-block;padding:.75em 1.4em;border-radius:12px;
    font:800 1rem/1 var(--body);text-decoration:none;cursor:pointer;
  }
  .btn-go{background:var(--ink);color:var(--paper);border:2px solid var(--ink)}
  .btn-again{background:transparent;color:var(--ink);border:2px solid var(--ink)}
  .btn-go:focus-visible, .btn-again:focus-visible, .result-close:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .result-close{
    position:absolute;top:8px;right:8px;width:44px;height:44px;
    border:0;border-radius:10px;background:transparent;color:var(--ink);
    font-size:1.5rem;line-height:1;cursor:pointer;
  }

  @media (prefers-reduced-motion:reduce){
    .lid, .spin{transition:none}
    .result, .skeleton, body.is-spinning .die{animation:none}
  }
</style>
</head>
<body>

<header class="top">
  <h1 id="siteTitle">ゲーム棚</h1>
  <p class="lead">自作のブラウザゲームを並べています。箱をタップすると、すぐに遊べます。</p>
  <div class="actions">
    <button id="spin" class="spin" type="button" disabled>
      <svg class="die" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="8" cy="8" r="1.9" fill="currentColor"/><circle cx="12" cy="12" r="1.9" fill="currentColor"/><circle cx="16" cy="16" r="1.9" fill="currentColor"/></svg>
      ルーレットで決める
    </button>
    <span id="count" class="count"></span>
  </div>
  <nav id="chips" class="chips" aria-label="ジャンルで絞り込む" hidden></nav>
</header>

<main>
  <ul id="shelf" class="shelf"></ul>
  <div id="state" class="state" hidden></div>
</main>

<section id="result" class="result" aria-live="polite" aria-label="ルーレットの結果" hidden>
  <p class="result-label">今日はこれで遊ぼう</p>
  <p id="resultTitle" class="result-title"></p>
  <div class="result-actions">
    <a id="resultGo" class="btn-go" href="#">あそぶ</a>
    <button id="resultAgain" class="btn-again" type="button">もう一回</button>
  </div>
  <button id="resultClose" class="result-close" type="button" aria-label="閉じる">×</button>
</section>

<script>
(() => {
  "use strict";

  /* ============ ここだけ書きかえればOK ============ */
  const CONFIG = {
    title: "ゲーム棚",   // ページの名前（上の大きな文字とタブの名前）
    owner: "tbtb-k",     // GitHubのユーザー名（自動で分からないときだけ使う）
    repo:  "games",      // リポジトリ名（同上）
    dir:   "",           // ゲームを置くフォルダ。いちばん上に置くなら空のまま
    // ファイル名の「_」より前をジャンルとして表示するときの呼び名
    genres: { party:"パーティー", puzzle:"パズル", action:"アクション", quiz:"クイズ", board:"ボード", card:"カード" }
  };
  /* ================================================ */

  const PALETTE = ["#F4B942","#F27A5E","#5CC8A8","#6FA8F5","#F28DB2","#A98BEA","#B5D95A","#F79A3E"];
  const SKIP = new Set(["index.html","index.htm","404.html"]);

  const $ = (s) => document.querySelector(s);
  const shelf = $("#shelf"), stateBox = $("#state"), spinBtn = $("#spin");
  const countEl = $("#count"), chipsEl = $("#chips");
  const result = $("#result"), resultTitle = $("#resultTitle"), resultGo = $("#resultGo");

  let items = [];
  let activeGenre = "";
  let spinning = false;

  document.title = CONFIG.title;
  $("#siteTitle").textContent = CONFIG.title;

  const repoInfo = detectRepo();
  const dir = (CONFIG.dir || "").replace(/^\/+|\/+$/g, "");
  const prefix = dir ? dir.split("/").map(encodeURIComponent).join("/") + "/" : "";
  const STORE_KEY = "game-shelf:" + repoInfo.owner + "/" + repoInfo.repo + "/" + dir;

  function detectRepo(){
    const host = location.hostname;
    if (host.endsWith(".github.io")) {
      const owner = host.split(".")[0];
      const first = location.pathname.split("/").filter(Boolean)[0];
      const repo = (!first || first.includes(".")) ? host : first;
      return { owner, repo };
    }
    return { owner: CONFIG.owner, repo: CONFIG.repo };
  }

  function el(tag, cls){ const n = document.createElement(tag); if (cls) n.className = cls; return n; }
  function wait(ms){ return new Promise(r => setTimeout(r, ms)); }
  function genreLabel(g){ return (CONFIG.genres && CONFIG.genres[g]) || g; }

  function saveItems(list){ try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); } catch (e) {} }
  function loadSaved(){ try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { return null; } }

  /* ---------- GitHubからファイル一覧をもらう ---------- */
  async function fetchListing(){
    const path = dir ? "/" + dir.split("/").map(encodeURIComponent).join("/") : "";
    const url = "https://api.github.com/repos/" + repoInfo.owner + "/" + repoInfo.repo + "/contents" + path;
    const res = await fetch(url);
    if (!res.ok) { const e = new Error("api"); e.status = res.status; throw e; }
    const data = await res.json();
    if (!Array.isArray(data)) { const e = new Error("not-dir"); e.status = 404; throw e; }
    return data;
  }

  /* ---------- 各ゲームの<title>と説明文を読む ---------- */
  async function readMeta(href){
    try {
      const r = await fetch(href, { cache: "no-cache" });
      if (!r.ok) return null;
      const type = r.headers.get("content-type") || "";
      if (type && !type.includes("html")) return null;
      const doc = new DOMParser().parseFromString(await r.text(), "text/html");
      const title = (doc.querySelector("title")?.textContent || "").replace(/\s+/g, " ").trim();
      const d = doc.querySelector('meta[name="description"]') || doc.querySelector('meta[property="og:description"]');
      return { title, desc: (d?.getAttribute("content") || "").trim() };
    } catch (e) { return null; }
  }

  async function resolveItems(list){
    const images = new Map();
    for (const f of list) {
      if (f.type !== "file") continue;
      const m = f.name.match(/^(.+)\.(png|jpe?g|webp|gif|svg)$/i);
      if (m && !images.has(m[1].toLowerCase())) images.set(m[1].toLowerCase(), f.name);
    }
    const cands = [];
    for (const f of list) {
      const name = f.name;
      if (/^[._]/.test(name)) continue;               // 「_」「.」で始まるものは並べない
      let base, href, isDir = false;
      if (f.type === "file" && /\.html?$/i.test(name)) {
        if (SKIP.has(name.toLowerCase())) continue;
        base = name.replace(/\.html?$/i, "");
        href = prefix + encodeURIComponent(name);
      } else if (f.type === "dir") {
        base = name;
        href = prefix + encodeURIComponent(name) + "/";
        isDir = true;
      } else continue;
      const us = base.indexOf("_");
      const genre = us > 0 ? base.slice(0, us).toLowerCase() : "";
      const plain = us > 0 ? base.slice(us + 1) : base;
      const img = images.get(base.toLowerCase());
      cands.push({
        key: base.toLowerCase(), href, isDir, genre,
        fallback: plain.replace(/[-_]+/g, " ").trim() || base,
        art: img ? prefix + encodeURIComponent(img) : ""
      });
    }
    const resolved = await Promise.all(cands.map(async (c) => {
      const meta = await readMeta(c.isDir ? c.href + "index.html" : c.href);
      if (!meta && c.isDir) return null;              // index.htmlが無いフォルダ（画像置き場など）は並べない
      return { key: c.key, href: c.href, genre: c.genre, art: c.art,
               title: (meta && meta.title) || c.fallback, desc: (meta && meta.desc) || "" };
    }));
    const out = resolved.filter(Boolean).sort((a, b) => a.title.localeCompare(b.title, "ja"));
    assignColors(out);
    return out;
  }

  // ゲームごとの色：名前から決めて、なるべくかぶらないようにする
  function assignColors(list){
    const used = new Array(PALETTE.length).fill(0);
    for (const it of list) {
      let h = 0;
      for (const ch of it.key) h = (h * 31 + ch.codePointAt(0)) >>> 0;
      const start = h % PALETTE.length;
      let best = start;
      for (let i = 0; i < PALETTE.length; i++) {
        const k = (start + i) % PALETTE.length;
        if (used[k] < used[best]) best = k;
      }
      used[best]++;
      it.color = PALETTE[best];
    }
  }

  function glyphOf(title){
    const s = title.replace(/^[\s\p{P}\p{S}]+/u, "");
    const g = Array.from(s)[0] || Array.from(title)[0] || "?";
    return g.toUpperCase();
  }

  /* ---------- 画面に並べる ---------- */
  function glyphEl(title){
    const g = el("span", "glyph");
    g.setAttribute("aria-hidden", "true");
    g.textContent = glyphOf(title);
    return g;
  }

  function card(it){
    const li = el("li", "item");
    li.dataset.genre = it.genre;
    const a = el("a", "box");
    a.href = it.href;
    a.dataset.title = it.title;
    a.style.setProperty("--c", it.color);
    const lid = el("span", "lid" + (it.art ? " has-art" : ""));
    if (it.art) {
      const img = el("img", "art");
      img.src = it.art; img.alt = ""; img.loading = "lazy"; img.decoding = "async";
      img.onerror = () => { img.remove(); lid.classList.remove("has-art"); lid.prepend(glyphEl(it.title)); };
      lid.append(img);
    } else {
      lid.append(glyphEl(it.title));
    }
    if (it.genre) { const g = el("span", "genre"); g.textContent = genreLabel(it.genre); lid.append(g); }
    const name = el("span", "name"); name.textContent = it.title; lid.append(name);
    a.append(lid);
    if (it.desc) { const d = el("span", "desc"); d.textContent = it.desc; a.append(d); }
    li.append(a);
    return li;
  }

  function showSkeleton(){
    shelf.innerHTML = "";
    stateBox.hidden = true;
    chipsEl.hidden = true;
    for (let i = 0; i < 4; i++) {
      const li = el("li", "item skeleton");
      li.setAttribute("aria-hidden", "true");
      li.innerHTML = '<span class="box"><span class="lid"></span><span class="bar"></span></span>';
      shelf.append(li);
    }
    countEl.textContent = "読み込み中…";
    spinBtn.disabled = true;
  }

  function showMessage(title, text, withRetry){
    shelf.innerHTML = "";
    chipsEl.hidden = true;
    stateBox.className = "state";
    stateBox.innerHTML = "";
    const s = el("strong"); s.textContent = title;
    const p = el("p"); p.textContent = text;
    stateBox.append(s, p);
    if (withRetry) {
      const b = el("button", "chip"); b.type = "button"; b.textContent = "もう一度読み込む";
      b.addEventListener("click", load);
      stateBox.append(b);
    }
    stateBox.hidden = false;
    countEl.textContent = "";
    spinBtn.disabled = true;
  }

  function render(stale){
    shelf.innerHTML = "";
    if (!items.length) {
      showMessage("まだゲームがありません",
        "このリポジトリにゲームのHTMLファイルをアップロードすると、ここに自動で並びます。", false);
      return;
    }
    for (const it of items) shelf.append(card(it));
    if (stale) {
      stateBox.className = "state is-note";
      stateBox.textContent = "GitHubにつながらなかったため、前回読み込んだ一覧を表示しています。";
      stateBox.hidden = false;
      shelf.before(stateBox);
    } else {
      stateBox.hidden = true;
    }
    const genres = [...new Set(items.map(i => i.genre).filter(Boolean))].sort();
    if (!genres.includes(activeGenre)) activeGenre = "";
    renderChips(genres);
    applyFilter();
  }

  function renderChips(genres){
    chipsEl.innerHTML = "";
    if (genres.length < 2) { chipsEl.hidden = true; activeGenre = ""; return; }
    const all = [["", "すべて"]].concat(genres.map(g => [g, genreLabel(g)]));
    for (const [g, label] of all) {
      const b = el("button", "chip");
      b.type = "button";
      b.textContent = label;
      b.setAttribute("aria-pressed", String(g === activeGenre));
      b.addEventListener("click", () => {
        activeGenre = g;
        for (const c of chipsEl.children) c.setAttribute("aria-pressed", String(c === b));
        applyFilter();
      });
      chipsEl.append(b);
    }
    chipsEl.hidden = false;
  }

  function applyFilter(){
    let n = 0;
    for (const li of shelf.children) {
      const show = !activeGenre || li.dataset.genre === activeGenre;
      li.hidden = !show;
      if (show) n++;
    }
    countEl.textContent = activeGenre ? items.length + "本中 " + n + "本" : items.length + "本";
    spinBtn.disabled = n === 0 || spinning;
    closeResult();
  }

  async function load(){
    showSkeleton();
    let list = null, err = null;
    try { list = await fetchListing(); } catch (e) { err = e; }
    if (list) {
      items = await resolveItems(list);
      saveItems(items);
      render(false);
      return;
    }
    const saved = loadSaved();
    if (Array.isArray(saved) && saved.length) {
      items = saved;
      render(true);
      return;
    }
    if (err && err.status === 404) {
      showMessage("リポジトリが見つかりませんでした",
        "「" + repoInfo.owner + "/" + repoInfo.repo + "」を探しましたが見つかりません。リポジトリが公開（Public）になっているか、このファイルの設定（owner と repo）が合っているか確かめてください。", true);
    } else {
      showMessage("ゲームの一覧を読み込めませんでした",
        "GitHubの読み込み回数の上限（1時間に60回）に達したか、通信が不安定な可能性があります。少し待ってから、もう一度読み込んでください。", true);
    }
  }

  /* ---------- ルーレット ---------- */
  function clearPicks(){
    document.body.classList.remove("has-pick");
    for (const b of shelf.querySelectorAll(".is-picked, .is-lit")) b.classList.remove("is-picked", "is-lit");
  }
  function closeResult(){ result.hidden = true; clearPicks(); }

  async function spin(){
    if (spinning) return;
    const boxes = [...shelf.children]
      .filter(li => !li.hidden && !li.classList.contains("skeleton"))
      .map(li => li.querySelector(".box"));
    if (!boxes.length) return;
    spinning = true;
    spinBtn.disabled = true;
    closeResult();

    const target = Math.floor(Math.random() * boxes.length);
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (!reduce && boxes.length > 1) {
      document.body.classList.add("is-spinning");
      const laps = Math.max(1, Math.ceil(12 / boxes.length));
      const steps = laps * boxes.length + target;
      const raw = [];
      for (let k = 1; k <= steps; k++) { const p = k / steps; raw.push(1 + 9 * p * p * p); }
      const scale = 2600 / raw.reduce((a, b) => a + b, 0);
      let prev = null;
      for (let k = 0; k <= steps; k++) {
        const b = boxes[k % boxes.length];
        if (prev) prev.classList.remove("is-lit");
        b.classList.add("is-lit");
        prev = b;
        if (k < steps) await wait(raw[k] * scale);
      }
      prev.classList.remove("is-lit");
      document.body.classList.remove("is-spinning");
    }

    const picked = boxes[target];
    picked.classList.add("is-picked");
    document.body.classList.add("has-pick");
    picked.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" });
    resultTitle.textContent = picked.dataset.title;
    resultGo.href = picked.getAttribute("href");
    result.hidden = false;
    resultGo.focus({ preventScroll: true });

    spinning = false;
    spinBtn.disabled = false;
  }

  spinBtn.addEventListener("click", spin);
  $("#resultAgain").addEventListener("click", spin);
  $("#resultClose").addEventListener("click", () => { closeResult(); spinBtn.focus(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !result.hidden) closeResult(); });

  load();
})();
</script>
</body>
</html>
